[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiv"
version = "0.2.0"
description = "Census-grounded prompt augmentation that makes text-to-image models render demographically representative people."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tijmen Jansen", email = "tijmenjansen97@gmail.com" }]
keywords = ["text-to-image", "diffusion", "fairness", "representation", "bias", "advertising", "flux", "stable-diffusion"]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/TijmenJansen0/prompt-div"
Repository = "https://github.com/TijmenJansen0/prompt-div"

[tool.setuptools]
packages = ["promptdiv"]

[tool.setuptools.package-data]
promptdiv = ["data/*.csv"]
